name: Build

# Builds the plugin (VST3 + Standalone, plus AU on macOS) on macOS, Windows and Linux, and packs the firmware patcher.
# A push of a tag v* also publishes a GitHub Release with all the files.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-2022
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S plugin -B build -A x64 -DBUILD_TESTS=ON
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          else
            cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Tests
        shell: bash
        run: |
          exe=$(find build -type f \( -name 'ModelCyclesCC_Tests' -o -name 'ModelCyclesCC_Tests.exe' \) -perm -u+x | head -n 1)
          [ -z "$exe" ] && exe=$(find build -type f -name 'ModelCyclesCC_Tests*' | grep -v '\.o$' | head -n 1)
          echo "running $exe"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$exe"; else "$exe"; fi

      - name: Pack
        shell: bash
        run: |
          art=build/ModelCyclesCC_artefacts/Release
          mkdir -p dist
          cd "$art"
          files="VST3 Standalone"
          [ -d AU ] && files="$files AU"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/dist/Modded_f-king_cycles-plugin-${{ matrix.name }}.zip" $files
          else
            zip -qry "$GITHUB_WORKSPACE/dist/Modded_f-king_cycles-plugin-${{ matrix.name }}.zip" $files
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.name }}
          path: dist/*.zip

  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the patcher
        run: python3 -m py_compile firmware/patch.py firmware/tools/build.py firmware/tools/aplib_grow.py && python3 firmware/tools/build.py --list
      - name: Pack
        run: |
          mkdir -p dist
          cp README.md LICENSE THIRD-PARTY-NOTICES.md firmware/
          (cd firmware && zip -qr ../dist/Modded_f-king_cycles-firmware-patcher.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-patcher
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, firmware]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## ${GITHUB_REF_NAME}/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Modded_f-king_cycles $GITHUB_REF_NAME" --notes "$notes"
